<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Pixiu X</title>
  <meta name="robots" content="noindex" />

  <!-- Usa tus hojas para mantener tipografías/colores -->
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/core.css">
  <link rel="shortcut icon" href="images/logo/fav-logo1.png">
  <!-- keep noindex on a thank-you page -->
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://pixiux.net/thank-you">


  <style>
    :root {
      --px-orange: #dd6d2c;
      --px-orange-10: #fee4d9;
      --px-ink: #101010;
      --px-muted: #6b7280;
      --px-bg: #fff6f0;
    }

    body {
      background: linear-gradient(180deg, var(--px-bg) 0%, #fff 60%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 16px;
    }

    .ty-card {
      width: min(920px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .08);
      padding: clamp(24px, 4vw, 48px);
      text-align: center;
      position: relative
    }

    .ty-badge {
      width: 84px;
      height: 84px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: var(--px-orange-10);
      border: 3px solid var(--px-orange)
    }

    .ty-title {
      font-size: clamp(26px, 4vw, 40px);
      margin: 0 0 10px;
      color: var(--px-ink);
      font-weight: 800
    }

    .ty-lead {
      color: var(--px-muted);
      max-width: 60ch;
      margin: 0 auto 18px
    }

    .ty-pill {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--px-orange-10);
      font-weight: 700;
      margin: 6px 0 18px;
      color: var(--px-ink)
    }

    .ty-actions {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 6px
    }

    .ty-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      border: 2px solid var(--px-orange);
      transition: transform .15s, box-shadow .2s
    }

    .ty-btn.primary {
      background: var(--px-orange);
      color: #fff
    }

    .ty-btn.ghost {
      background: transparent;
      color: var(--px-orange)
    }

    .ty-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(221, 109, 44, .25)
    }

    .ty-social {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px
    }

    .ty-social a {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: var(--px-orange-10);
      color: var(--px-ink)
    }

    .ty-social img {
      width: 20px;
      height: 20px
    }

    .ty-social svg {
      width: 20px;
      height: 20px;
      display: block
    }

    .ty-footnote {
      color: var(--px-muted);
      margin-top: 18px;
      font-size: .95rem
    }

    @media (prefers-reduced-motion:reduce) {
      .ty-btn:hover {
        transform: none
      }
    }
  </style>


    <script id="vtag-ai-js" async src="https://r2.leadsy.ai/tag.js" data-pid="KcrWuMtmnmkv8VFI" data-version="062024"></script>
</head>

<body>
  <main class="ty-card" aria-labelledby="ty-title">
    <div class="ty-badge" aria-hidden="true">
      <img src="images/logo/fav-logo3.png" alt="">
    </div>

    <h1 id="ty-title" class="ty-title">Thank you<span id="ty-name-slot"></span>!</h1>
    <p class="ty-lead">We’ve received your request and our team will get back to you shortly.</p>

    <div class="ty-pill" id="ty-service-pill" hidden>
      <span>Service selected:</span>
      <strong id="ty-service-slot"></strong>
    </div>

    <div class="ty-actions">
      <a class="ty-btn primary" href="/">
        Back to Home
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="M12 5l7 7-7 7"></path>
        </svg>
      </a>
      <a class="ty-btn ghost" href="/contact#contactForm">Send another message</a>
    </div>

    <!-- Social: FB/IG desde CDN y LinkedIn inline para evitar bloqueos -->
    <div class="ty-social" aria-label="Follow us">
      <a href="https://www.facebook.com/people/Pixiu-X/61561672509335/" aria-label="Facebook" target="_blank"
        rel="noopener">
        <img src="https://cdn.simpleicons.org/facebook/101010" alt="Facebook" loading="lazy" decoding="async">
      </a>
      <a href="https://www.instagram.com/pixiu_x/" aria-label="Instagram" target="_blank" rel="noopener">
        <img src="https://cdn.simpleicons.org/instagram/101010" alt="Instagram" loading="lazy" decoding="async">
      </a>
      <a href="https://www.linkedin.com/company/pixiu-x" aria-label="LinkedIn" target="_blank"
        rel="noopener">
        <!-- LinkedIn inline (hereda color con currentColor) -->
        <svg viewBox="0 0 24 24" role="img" aria-label="LinkedIn">
          <title>LinkedIn</title>
          <path fill="currentColor"
            d="M22.225 0H1.771C.792 0 0 .774 0 1.728v20.543C0 23.228.792 24 1.771 24h20.451C23.2 24 24 23.228 24 22.271V1.728C24 .774 23.2 0 22.222 0h.003zM7 20.452H3.69V9H7v11.452zM5.337 7.433a2.062 2.062 0 110-4.124 2.062 2.062 0 010 4.124zM20.447 20.452h-3.554V14.86c0-1.335-.027-3.056-1.862-3.056-1.862 0-2.146 1.454-2.146 2.956v5.692H9.331V9h3.414v1.561h.049c.476-.9 1.637-1.848 3.367-1.848 3.6 0 4.266 2.371 4.266 5.455v6.284z" />
        </svg>
      </a>
    </div>
  </main>

  <script>
    // Personalización con parámetros: ?name=Juan&service=Design
    const params = new URLSearchParams(location.search);
    const name = params.get('name');
    const service = params.get('service');
    if (name) document.getElementById('ty-name-slot').textContent = `, ${decodeURIComponent(name)}`;
    if (service) {
      document.getElementById('ty-service-slot').textContent = decodeURIComponent(service);
      document.getElementById('ty-service-pill').hidden = false;
    }

    // Lee UTM guardados y dispara evento de conversión (si usas GTM/GA4)
    try {
      const utm = JSON.parse(sessionStorage.getItem('px_utm') || '{}');
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'leadSubmitted', service: service || '', name: name || '', ...utm });
    } catch (e) { }
  </script>
</body>

</html>
